name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  JAVA_VERSION: '25'
  JAVA_DISTRO: 'temurin'

jobs:
  build:
    if: startsWith(github.event.head_commit.message, '🏁 Releasing version') != true && startsWith(github.event.head_commit.message, '⬆️  Next version') != true
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.connect_version == 'NIGHTLY' }}
    steps:
      - name: 'Check out repository'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: 'Set up Java'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRO }}
          cache: maven

      - name: 'Build'
        run: ./mvnw -ntp -B --file pom.xml verify
        env:
          CONNECT_VERSION: ${{ matrix.connect_version }}

    strategy:
      fail-fast: false
      matrix:
        # The newest Kafka line of each major version: LATEST_STABLE is the Debezium image with the
        # newest Kafka 4.x; NIGHTLY, a Debezium snapshot, only warns of upcoming changes.
        connect_version: [
          NIGHTLY,
          LATEST_STABLE,
          "3.9",
          "2.8",
        ]
