# Checks the secrets the Release workflow needs, without publishing anything.
name: Check release credentials

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 'Homebrew tap token'
        env:
          TOKEN: ${{ secrets.JRELEASER_HOMEBREW_GITHUB_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::JRELEASER_HOMEBREW_GITHUB_TOKEN is not set"
            exit 1
          fi
          status=$(curl -sS -o repo.json -D headers.txt -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" https://api.github.com/repos/kcctl/homebrew-tap)
          echo "HTTP status: $status"
          grep -iE '^(x-oauth-scopes|github-authentication-token-expiration):' headers.txt \
            || echo "No scope or expiration header (fine-grained token without expiration, or not a PAT)"
          if [ "$status" != "200" ]; then
            echo "::error::The token is not accepted for kcctl/homebrew-tap (HTTP $status)"
            exit 1
          fi
          echo "Account role on kcctl/homebrew-tap: $(jq -c .permissions repo.json)"

      - name: 'SDKMAN credentials present'
        env:
          KEY: ${{ secrets.JRELEASER_SDKMAN_CONSUMER_KEY }}
          TOKEN: ${{ secrets.JRELEASER_SDKMAN_CONSUMER_TOKEN }}
        run: |
          missing=0
          [ -n "$KEY" ] || { echo "::error::JRELEASER_SDKMAN_CONSUMER_KEY is not set"; missing=1; }
          [ -n "$TOKEN" ] || { echo "::error::JRELEASER_SDKMAN_CONSUMER_TOKEN is not set"; missing=1; }
          [ "$missing" = 0 ] && echo "Both SDKMAN secrets are set; their validity is only checked by a release."
          exit "$missing"
